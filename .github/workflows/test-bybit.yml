
name: Test Binance Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Binance Futures API
        run: |
          curl -sS -o response.json -w 'HTTP status: %{http_code}\n' \
            'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=2'
          head -c 500 response.json
          echo
